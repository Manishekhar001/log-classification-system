# render.yaml — Log Classification API
# Deploy on Render: https://render.com/docs/blueprint-spec
#
# This service deploys a FastAPI app that classifies system logs
# using Regex → BERT → LLM fallback pipeline.

services:
  - type: web
    name: log-classification-api
    runtime: python
    plan: free

    # Build command: install deps + pre-download the BERT model to avoid cold-start delays
    buildCommand: |
      pip install -r requirements.txt
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

    # Start command: FastAPI via uvicorn
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT

    # Health check
    healthCheckPath: /health

    # Environment variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: BERT_CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: LLM_MODEL
        value: deepseek-r1-distill-llama-70b
      - key: LLM_TEMPERATURE
        value: "0.5"
      - key: LLM_CACHE_SIZE
        value: "128"
      - key: ENABLE_REGEX
        value: "true"
      - key: ENABLE_BERT
        value: "true"
      - key: ENABLE_LLM
        value: "true"
